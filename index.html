<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Zoom is locked at the owner's request (native feel); Lainnya > Tampilan offers a larger text size instead. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12181b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stimulasi Anak" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Stimulasi Anak</title>
  </head>
  <body>
    <!-- Solid strip under the iOS status bar, present from the first paint: Safari 26 decides its top edge
         treatment from the fixed elements it finds there, and a React-rendered strip arrives too late. -->
    <div id="top-guard" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
